// "Yesterday's" version of SubscriptionChangedProto for schema-evolution tests.
// Same message name as evolution_v2.proto but a different proto package and
// java_package, so both versions coexist in one compilation unit.
syntax = "proto3";

package outboxer.test.evolution.v1;

option java_package = "io.github.bams22.outboxer.serializer.protobuf.testproto.v1";
option java_multiple_files = true;

message SubscriptionChangedProto {
  string subscription_id = 1;
  int32 old_plan_code = 2; // removed in v2
}
