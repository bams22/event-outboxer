# Default Micrometer distribution settings for the event-outboxer timers.
#
# Applied automatically by the Spring Boot starter (an
# EnvironmentPostProcessor appends this file with the LOWEST precedence),
# so any management.metrics.distribution.* value you set yourself always
# wins. Disable entirely with:
#
#   event-outboxer:
#     metrics:
#       distribution-defaults:
#         enabled: false
#
# The SLO boundaries below publish histogram buckets (_bucket{le=...}
# series in Prometheus): aggregatable across pods, so fleet-wide
# histogram_quantile() works out of the box with precision limited to
# the bucket grid (~19 extra series per tag combination). For finer
# quantiles enable management.metrics.distribution.percentiles-histogram
# on top — the boundaries merge.
#
# Note: keys below use the default metric prefix. If you override
# event-outboxer.metrics.prefix, set your own SLO boundaries under the
# new names (these defaults will simply not match any meter).
management:
  metrics:
    distribution:
      slo:
        # Publish -> claim wait: a grid dense in the sub-second range where a
        # healthy outbox lives, sparse in the tail. The tail reaches 1h
        # because queue_time is measured from the ORIGINAL publish on every
        # claim — retried events with exponential backoff legitimately wait
        # many minutes.
        "[event_outboxer.events.queue_time]":
          - 10ms
          - 25ms
          - 50ms
          - 75ms
          - 100ms
          - 150ms
          - 250ms
          - 500ms
          - 750ms
          - 1s
          - 1500ms
          - 2500ms
          - 5s
          - 10s
          - 20s
          - 30s
          - 45s
          - 1m
          - 2m
          - 5m
          - 15m
          - 30m
          - 1h
        # Claim -> finalize duration: the tail must cover the default
        # handler-max-runtime budget (5m, configurable per type), with one
        # bucket beyond it to separate "at budget" from "way over".
        "[event_outboxer.events.processing_time]":
          - 10ms
          - 25ms
          - 50ms
          - 75ms
          - 100ms
          - 150ms
          - 250ms
          - 500ms
          - 750ms
          - 1s
          - 1500ms
          - 2500ms
          - 5s
          - 10s
          - 20s
          - 30s
          - 45s
          - 1m
          - 2m
          - 5m
          - 10m
        # Time spent acquiring an entity lock, the bounded lock-wait of
        # ADR-0035 included: a grid dense around the default 100 ms budget so
        # the share of acquisitions that needed the wait — and how close to
        # the ceiling they land — reads off the buckets.
        "[event_outboxer.lock.wait_time]":
          - 1ms
          - 2ms
          - 5ms
          - 10ms
          - 20ms
          - 50ms
          - 100ms
          - 200ms
          - 500ms
          - 1s
          - 2s
          - 5s
        # Entity-lock hold time (handler + finalize): the number lock-wait and
        # lock-ttl are sized against, so the same grid as the wait plus the
        # tail up to the default lock-ttl.
        "[event_outboxer.lock.hold_time]":
          - 1ms
          - 2ms
          - 5ms
          - 10ms
          - 20ms
          - 50ms
          - 100ms
          - 200ms
          - 500ms
          - 1s
          - 2s
          - 5s
          - 10s
          - 30s
          - 1m
          - 5m
          - 10m
        # Stuck-handler runtime at watchdog reclaim: always >= handlerMaxRuntime,
        # so the grid starts where the other timers end.
        "[event_outboxer.handler.stuck_time]":
          - 30s
          - 1m
          - 2m
          - 5m
          - 10m
          - 15m
          - 30m
          - 1h
