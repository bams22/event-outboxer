name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR — spares GitHub Actions minutes
# when pushing rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Baseline JDK 25 (LTS) — ADR-0017; enforcer rejects anything older.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven verify (unit)
        run: ./mvnw -B -ntp clean verify

  it:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven verify -P it
        run: ./mvnw -B -ntp clean verify -P it
