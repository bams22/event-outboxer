# Default Micrometer distribution settings for the event-outboxer timers.
#
# Opt-in: this file is NOT loaded automatically. Import it from your
# application configuration:
#
#   spring:
#     config:
#       import: "classpath:META-INF/event-outboxer/metrics-defaults.yml"
#
# It configures client-side percentiles (p50/p75/p90/p95/p99) for every
# event-outboxer timer. These are published as precomputed per-JVM gauge
# series (Prometheus: {quantile="0.5"} ... {quantile="0.99"}) — cheap
# (+5 series per tag combination), but NOT aggregatable across pods; a
# fleet-wide percentile still requires histogram buckets
# (management.metrics.distribution.percentiles-histogram).
#
# Note: keys below use the default metric prefix. If you override
# event-outboxer.metrics.prefix, copy this file and adjust the names.
management:
  metrics:
    distribution:
      percentiles:
        "[event_outboxer.events.queue_time]": [0.5, 0.75, 0.90, 0.95, 0.99]
        "[event_outboxer.events.processing_time]": [0.5, 0.75, 0.90, 0.95, 0.99]
        "[event_outboxer.handler.stuck_time]": [0.5, 0.75, 0.90, 0.95, 0.99]
