server:
  port: 8080

spring:
  application:
    name: outboxer-example
  datasource:
    url: jdbc:postgresql://localhost:5432/outbox
    username: outbox
    password: outbox
  # spring.flyway.* is the application's own instance (db/migration: the orders
  # table). The outbox schema is migrated by the starter's dedicated Flyway
  # instance (ADR-0028) — its locations are fixed, nothing to list here.

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always

event-outboxer:
  storage:
    type: postgres
  # flyway:                                   # optional: a dedicated DDL role
  #   url: jdbc:postgresql://localhost:5432/outbox
  #   user: outbox_migrator
  #   password: secret
  lock:
    # Lease-table locker (ADR-0022): no pinned connections, pgBouncer-safe.
    type: postgres-lease
  publisher:
    # @Transactional is required on every publish. Set to IGNORE if you
    # know what you're doing — e.g. maintenance scripts.
    no-transaction-policy: FAIL
  maintenance:
    heartbeat-interval: 5s
    dead-threshold: 30s
    orphan-recovery-interval: 30s
    watchdog-interval: 10s
  event-types:
    defaults:
      poll-min-interval: 500ms
      poll-max-interval: 5s
      claim-batch-size: 10
      handler-pool-size: 3
      handler-max-runtime: 1m

logging:
  level:
    io.github.bams22.outboxer: DEBUG
